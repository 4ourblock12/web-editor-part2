<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title Maker Updater</title>
<style>
body{font-family:system-ui,sans-serif;background:#0f172a;color:#f8fafc;max-width:640px;margin:30px auto;padding:0 16px;line-height:1.5}
h1{font-size:1.3rem}textarea,input,button{width:100%;margin:6px 0;padding:11px;border-radius:8px;border:2px solid #334155;background:#1e293b;color:#fff;font:inherit}
textarea{height:140px;font-family:monospace;font-size:.8rem}button{background:#3b82f6;border:0;font-weight:700;cursor:pointer}
#st{color:#94a3b8;font-size:.9rem}.ok{color:#22c55e!important}.err{color:#ef4444!important}
</style></head><body>
<h1>Title Maker Updater</h1>
<p>Removes GameHouse, Strategy, Space, Sports, Ninja, Rhythm and Noir, then adds 14 color themes. Pick your current HTML file (or paste it below) and get the full updated file.</p>
<input type="file" id="f" accept=".html,.htm,text/html">
<textarea id="t" placeholder="...or paste your full HTML here"></textarea>
<button id="go" type="button">Update and download</button>
<p id="st"></p>
<script type="text/plain" id="patch">
/* ===== THEME UPDATE =====
   Paste this whole block in your HTML, just ABOVE the line:
       document.fonts.ready.then(renderCanvas);
   Removes: gamehouse, strategy, space, sports, ninja, rhythm, noir
   Adds: 14 new color themes (red, orange, gold, lime, emerald, teal, sky,
   indigo, violet, pink, brown, silver, black, white). Uses fonts already loaded. */
(() => {
    // 1. Remove themes
    ['gamehouse', 'strategy', 'space', 'sports', 'ninja', 'rhythm', 'noir'].forEach(id => {
        delete themes[id];
        const o = themeSelect.querySelector(`option[value="${id}"]`);
        if (o) o.remove();
    });

    // 2. Background patterns
    const P = {
        rays(c, w, h, a) {
            c.globalAlpha = .16; c.fillStyle = a;
            for (let i = 0; i < 360; i += 20) {
                c.beginPath(); c.moveTo(w * .8, h / 2);
                c.lineTo(w * .8 + Math.cos(i * Math.PI / 180) * w, h / 2 + Math.sin(i * Math.PI / 180) * w);
                c.lineTo(w * .8 + Math.cos((i + 10) * Math.PI / 180) * w, h / 2 + Math.sin((i + 10) * Math.PI / 180) * w);
                c.fill();
            }
        },
        bubbles(c, w, h, a) {
            c.globalAlpha = .2; c.fillStyle = a;
            for (let i = 0; i < 16; i++) { c.beginPath(); c.arc(Math.random() * w, Math.random() * h, 12 + Math.random() * 40, 0, Math.PI * 2); c.fill(); }
        },
        diamonds(c, w, h, a) {
            c.globalAlpha = .18; c.strokeStyle = a; c.lineWidth = 2;
            for (let x = 0; x < w + 60; x += 60) for (let y = 0; y < h + 60; y += 60) {
                c.beginPath(); c.moveTo(x, y - 24); c.lineTo(x + 24, y); c.lineTo(x, y + 24); c.lineTo(x - 24, y); c.closePath(); c.stroke();
            }
        },
        dots(c, w, h, a) {
            c.globalAlpha = .25; c.fillStyle = a;
            for (let x = 0; x < w; x += 28) for (let y = 0; y < h; y += 28) { c.beginPath(); c.arc(x + 14, y + 14, 4, 0, Math.PI * 2); c.fill(); }
        },
        stripes(c, w, h, a) {
            c.globalAlpha = .14; c.fillStyle = a;
            for (let i = -h; i < w; i += 44) { c.beginPath(); c.moveTo(i, h); c.lineTo(i + 22, h); c.lineTo(i + 22 + h, 0); c.lineTo(i + h, 0); c.fill(); }
        },
        waves(c, w, h, a) {
            c.globalAlpha = .3; c.strokeStyle = a; c.lineWidth = 3;
            for (let y = 30; y < h; y += 34) {
                c.beginPath();
                for (let x = 0; x <= w; x += 10) c.lineTo(x, y + Math.sin(x / 40 + y) * 8);
                c.stroke();
            }
        },
        stars(c, w, h, a) {
            c.fillStyle = a;
            for (let i = 0; i < 90; i++) { c.globalAlpha = .3 + Math.random() * .7; c.beginPath(); c.arc(Math.random() * w, Math.random() * h, Math.random() * 2.2, 0, Math.PI * 2); c.fill(); }
        },
        sparkles(c, w, h, a) {
            c.fillStyle = a; c.globalAlpha = .5;
            for (let i = 0; i < 18; i++) {
                const x = Math.random() * w, y = Math.random() * h, s = 5 + Math.random() * 9;
                c.beginPath(); c.moveTo(x, y - s); c.lineTo(x + s / 3, y - s / 3); c.lineTo(x + s, y); c.lineTo(x + s / 3, y + s / 3);
                c.lineTo(x, y + s); c.lineTo(x - s / 3, y + s / 3); c.lineTo(x - s, y); c.lineTo(x - s / 3, y - s / 3); c.fill();
            }
        }
    };

    // 3. Color theme factory
    const color = (o) => ({
        titleFont: `'${o.font}', sans-serif`, titleSize: o.size || 60, titleColor: o.title, titleShadow: o.shadow,
        subFont: `'${o.subFont || o.font}', sans-serif`, subSize: 30, subColor: o.sub, subShadow: o.subShadow || 'transparent',
        pixelatedImage: false, shadowOffsetX: o.outline ? 0 : 4, shadowOffsetY: o.outline ? 0 : 4, outline: !!o.outline,
        frameColor: o.frame, gem: o.gem,
        drawBackground: (c, w, h) => {
            const g = c.createLinearGradient(0, 0, w, h);
            g.addColorStop(0, o.c1); g.addColorStop(1, o.c2);
            c.fillStyle = g; c.fillRect(0, 0, w, h);
            c.save(); P[o.pattern](c, w, h, o.accent); c.restore();
            const sh = c.createLinearGradient(0, 0, 0, h * .5);
            sh.addColorStop(0, 'rgba(255,255,255,0.14)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
            c.fillStyle = sh; c.fillRect(0, 0, w, h * .5);
        }
    });

    Object.assign(themes, {
        ruby:     color({ font: 'Teko', size: 76, title: '#ffffff', shadow: '#7f1d1d', sub: '#fecaca', c1: '#ef4444', c2: '#7f1d1d', accent: '#ffffff', pattern: 'rays', frame: '#fecaca', gem: ['#fca5a5', '#dc2626', '#7f1d1d'] }),
        orange:   color({ font: 'Luckiest Guy', title: '#ffffff', shadow: '#c2410c', sub: '#fff7ed', c1: '#fb923c', c2: '#c2410c', accent: '#ffedd5', pattern: 'bubbles', outline: true, subShadow: '#9a3412', frame: '#ffedd5', gem: ['#fdba74', '#f97316', '#9a3412'] }),
        gold:     color({ font: 'Cinzel', size: 54, title: '#fff3b0', shadow: '#422006', sub: '#fde68a', subShadow: '#422006', c1: '#a16207', c2: '#2b1805', accent: '#fde047', pattern: 'diamonds', frame: '#fbbf24', gem: ['#fef08a', '#eab308', '#854d0e'] }),
        lime:     color({ font: 'Chewy', title: '#ffffff', shadow: '#3f6212', sub: '#1a2e05', c1: '#bef264', c2: '#65a30d', accent: '#ffffff', pattern: 'dots', outline: true, frame: '#ecfccb', gem: ['#d9f99d', '#84cc16', '#3f6212'] }),
        emerald:  color({ font: 'Rajdhani', size: 68, title: '#ffffff', shadow: '#022c22', sub: '#a7f3d0', c1: '#10b981', c2: '#064e3b', accent: '#ffffff', pattern: 'stripes', frame: '#a7f3d0', gem: ['#6ee7b7', '#10b981', '#064e3b'] }),
        teal:     color({ font: 'Righteous', title: '#ffffff', shadow: '#115e59', sub: '#ccfbf1', c1: '#2dd4bf', c2: '#0f766e', accent: '#ffffff', pattern: 'waves', outline: true, subShadow: '#134e4a', frame: '#ccfbf1', gem: ['#99f6e4', '#14b8a6', '#115e59'] }),
        sky:      color({ font: 'Fredoka', title: '#ffffff', shadow: '#0369a1', sub: '#e0f2fe', c1: '#7dd3fc', c2: '#0284c7', accent: '#ffffff', pattern: 'bubbles', outline: true, subShadow: '#075985', frame: '#ffffff', gem: ['#bae6fd', '#38bdf8', '#0369a1'] }),
        indigo:   color({ font: 'Orbitron', size: 54, title: '#c7d2fe', shadow: '#1e1b4b', sub: '#a5b4fc', c1: '#312e81', c2: '#0b0a2e', accent: '#e0e7ff', pattern: 'stars', frame: '#818cf8', gem: ['#a5b4fc', '#6366f1', '#312e81'] }),
        violet:   color({ font: 'Macondo', title: '#ffffff', shadow: '#581c87', sub: '#f3e8ff', c1: '#a855f7', c2: '#4c1d95', accent: '#f5d0fe', pattern: 'sparkles', outline: true, subShadow: '#3b0764', frame: '#e9d5ff', gem: ['#e9d5ff', '#a855f7', '#581c87'] }),
        pink:     color({ font: 'Fredoka', title: '#ffffff', shadow: '#be185d', sub: '#fce7f3', c1: '#f9a8d4', c2: '#db2777', accent: '#ffffff', pattern: 'dots', outline: true, subShadow: '#9d174d', frame: '#ffffff', gem: ['#fbcfe8', '#ec4899', '#9d174d'] }),
        brown:    color({ font: 'Acme', size: 62, title: '#fde7cf', shadow: '#2a1409', sub: '#e7c8a0', c1: '#92400e', c2: '#2a1409', accent: '#fcd9a8', pattern: 'stripes', frame: '#d6a56b', gem: ['#e7c8a0', '#a16207', '#451a03'] }),
        silver:   color({ font: 'Rajdhani', size: 68, title: '#ffffff', shadow: '#1e293b', sub: '#e2e8f0', c1: '#94a3b8', c2: '#334155', accent: '#ffffff', pattern: 'stripes', frame: '#e2e8f0', gem: ['#f1f5f9', '#94a3b8', '#334155'] }),
        obsidian: color({ font: 'Teko', size: 78, title: '#ffffff', shadow: '#000000', sub: '#a3a3a3', c1: '#262626', c2: '#000000', accent: '#ffffff', pattern: 'rays', frame: '#737373', gem: ['#737373', '#262626', '#000000'] }),
        pearl:    color({ font: 'Playfair Display', size: 54, title: '#1e293b', shadow: '#ffffff', sub: '#475569', c1: '#ffffff', c2: '#cbd5e1', accent: '#94a3b8', pattern: 'diamonds', frame: '#94a3b8', gem: ['#ffffff', '#e2e8f0', '#94a3b8'] })
    });

    // 4. Dropdown entries for the new themes
    [['ruby', 'Ruby / Red'], ['orange', 'Sunset / Orange'], ['gold', 'Gold / Treasure'], ['lime', 'Lime / Fresh'],
     ['emerald', 'Emerald / Green'], ['teal', 'Teal / Lagoon'], ['sky', 'Sky / Light Blue'], ['indigo', 'Indigo / Night'],
     ['violet', 'Violet / Purple'], ['pink', 'Candy / Pink'], ['brown', 'Chocolate / Brown'], ['silver', 'Silver / Steel'],
     ['obsidian', 'Obsidian / Black'], ['pearl', 'Pearl / White']
    ].forEach(([id, label]) => {
        const o = document.createElement('option'); o.value = id; o.textContent = label; themeSelect.appendChild(o);
    });

    // 5. Renumber, update counts, pick a valid default
    [...themeSelect.options].forEach((o, i) => { o.textContent = `${i + 1}. ` + o.textContent.replace(/^\d+\.\s*/, ''); });
    themeSelect.selectedIndex = 0;
    const n = themeSelect.options.length;
    document.querySelector('.controls h2').textContent = `Title Maker (${n} Themes)`;
    document.querySelector('.instructions').innerHTML = `Resolusi internal HD 1000x250 px.<br>Pilih dari ${n} tema unik untuk segala jenis game.`;

    // 6. Default icon for the new color themes (glossy gem in the theme color)
    const baseIcon = drawDefaultIcon;
    drawDefaultIcon = function (c, x, y, size, id) {
        const t = themes[id];
        if (!t || !t.gem) return baseIcon(c, x, y, size, id);
        c.save();
        const pad = 6, s = size - pad * 2;
        const g = c.createLinearGradient(0, y + pad, 0, y + pad + s);
        g.addColorStop(0, t.gem[0]); g.addColorStop(.55, t.gem[1]); g.addColorStop(1, t.gem[2]);
        c.fillStyle = g; c.beginPath(); c.roundRect(x + pad, y + pad, s, s, 40); c.fill();
        c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 4; c.stroke();
        const gl = c.createLinearGradient(0, y + pad, 0, y + pad + s * .5);
        gl.addColorStop(0, 'rgba(255,255,255,0.7)'); gl.addColorStop(1, 'rgba(255,255,255,0.05)');
        c.fillStyle = gl; c.beginPath(); c.roundRect(x + pad + 8, y + pad + 6, s - 16, s * .45, [32, 32, 60, 60]); c.fill();
        c.fillStyle = 'rgba(255,255,255,0.92)'; c.beginPath();
        const cx = x + size / 2, cy = y + size / 2 + 10;
        for (let k = 0; k < 10; k++) { const r = k % 2 ? 11 : 26, a = -Math.PI / 2 + k * Math.PI / 5; c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
        c.fill();
        c.restore();
    };
})();

</script>
<script>
const $=i=>document.getElementById(i), IDS=['gamehouse','strategy','space','sports','ninja','rhythm','noir'];
const st=(m,c)=>{$('st').textContent=m;$('st').className=c||''};
function stripTheme(s,id){
  const m=new RegExp('\\n[ \\t]*'+id+': \\{').exec(s); if(!m) return s;
  let i=m.index+m[0].length,d=1;
  while(i<s.length&&d>0){const ch=s[i]; if(ch==='{')d++; else if(ch==='}')d--; i++;}
  if(s[i]===',')i++;
  return s.slice(0,m.index)+s.slice(i);
}
function patch(src){
  const mark='document.fonts.ready.then(renderCanvas);';
  if(!src.includes(mark)||!src.includes('const themes = {')) throw new Error('This does not look like the Title Maker file.');
  IDS.forEach(id=>{
    src=stripTheme(src,id);
    src=src.replace(new RegExp('[ \\t]*<option value="'+id+'"[^>]*>[^<]*</option>\\n?','g'),'');
  });
  const code=$('patch').textContent.trim();
  return src.replace(mark,()=>'<\/script>'.slice(0,0)+code+'\n\n    '+mark);
}
async function run(){
  try{
    let src=$('t').value; const f=$('f').files[0];
    if(!src&&f) src=await f.text();
    if(!src) return st('Choose a file or paste the HTML first.','err');
    const out=patch(src);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));
    a.download='title-maker-updated.html'; document.body.appendChild(a); a.click(); a.remove();
    $('t').value=out; st('Done. Downloaded title-maker-updated.html (full code is also in the box above).','ok');
  }catch(e){st(e.message,'err')}
}
$('go').addEventListener('click',run);
</script></body></html>
